name: Test

on:
  pull_request:
  # Reusable: release.yml calls this workflow so a release can't start on a
  # failing test suite. See .github/workflows/release.yml.
  workflow_call:

jobs:
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # required to post the coverage comment
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Report coverage
        # Only comment on real PRs. When called from release.yml (push event)
        # there is no PR to comment on, so this step is skipped.
        if: ${{ github.event_name == 'pull_request' }}
        uses: davelosert/vitest-coverage-report-action@v2
